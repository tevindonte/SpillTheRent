<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 12px;
        min-width: 220px;
        background: #111;
        color: #eee;
      }
      label {
        display: block;
        margin-top: 8px;
        color: #888;
        font-size: 11px;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 6px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #0a0a0a;
        color: #fff;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        background: #f97316;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <strong>spillthe.rent</strong>
    <p style="color: #888; font-size: 11px">StreetEasy overlay (beta)</p>
    <label>API base URL</label>
    <input id="apiBase" type="url" placeholder="https://spillthe.rent" />
    <button id="save">Save</button>
    <script src="popup.js"></script>
  </body>
</html>

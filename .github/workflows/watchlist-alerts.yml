# Free scheduled watchlist emails — hits production /api/cron/watchlist-alerts
#
# Setup (one time):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#     CRON_SECRET  — same value as on Render (web service env)
#     SITE_URL     — optional; default https://spillthe.rent
#
# Manual run: Actions → Watchlist alerts → Run workflow

name: Watchlist alerts

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Add CRON_SECRET in repo Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Trigger watchlist alert cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          BASE="${SITE_URL:-https://spillthe.rent}"
          BASE="${BASE%/}"
          echo "Calling ${BASE}/api/cron/watchlist-alerts"
          HTTP_CODE=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/watchlist-alerts")
          cat /tmp/cron-body.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Request failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
